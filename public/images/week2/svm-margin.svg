<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>
  <!-- axes -->
  <line x1="30" y1="330" x2="450" y2="330" stroke="#999" stroke-width="1"/>
  <line x1="30" y1="330" x2="30" y2="20" stroke="#999" stroke-width="1"/>

  <!-- margin boundary lines (dashed) -->
  <line x1="60" y1="60" x2="420" y2="300" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="90" y1="40" x2="450" y2="280" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- decision boundary (solid, centered) -->
  <line x1="75" y1="50" x2="435" y2="290" stroke="#111827" stroke-width="2.5"/>

  <!-- class -1 points (blue circles) below/left of boundary -->
  <circle cx="110" cy="90" r="8" fill="#3b82f6"/>
  <circle cx="150" cy="70" r="8" fill="#3b82f6"/>
  <circle cx="90" cy="150" r="8" fill="#3b82f6"/>
  <circle cx="180" cy="110" r="8" fill="#3b82f6"/>
  <circle cx="130" cy="160" r="8" fill="#3b82f6"/>

  <!-- support vector for class -1 (on the blue dashed margin line), highlighted -->
  <circle cx="200" cy="150" r="10" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>

  <!-- class +1 points (red circles) above/right of boundary -->
  <circle cx="330" cy="250" r="8" fill="#ef4444"/>
  <circle cx="370" cy="200" r="8" fill="#ef4444"/>
  <circle cx="300" cy="200" r="8" fill="#ef4444"/>
  <circle cx="390" cy="260" r="8" fill="#ef4444"/>
  <circle cx="410" cy="220" r="8" fill="#ef4444"/>

  <!-- support vector for class +1 (on the red dashed margin line), highlighted -->
  <circle cx="270" cy="180" r="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>

  <!-- margin width annotation -->
  <line x1="180" y1="330" x2="230" y2="330" stroke="#6b7280" stroke-width="1"/>
  <text x="150" y="350" font-family="sans-serif" font-size="14" fill="#374151">margin = 2 / ||w||</text>

  <text x="260" y="30" font-family="sans-serif" font-size="14" fill="#111827">결정 경계 (w·x+b=0)</text>
  <text x="330" y="440" font-family="sans-serif" font-size="1"></text>
</svg>
