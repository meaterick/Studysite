name: Security and build checks

on:
  pull_request:
    branches: [main]
  # main에 직접 푸시한 변경과 새로 공개된 의존성 보안 권고도 확인한다. 배포 워크플로와 별개라 배포를 막지 않는다.
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 0" # 매주 월요일 03:17(KST)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: python3 tests/security/security-inventory.test.py
      - run: python3 tests/security/security-collector.test.py
      - run: npm run lint
      - run: npm run test:curriculum
      - run: npm run validate:content
      - run: npm run docs:check
      - run: npm run build
      - name: Assemble standalone for HTTP checks
        run: |
          mkdir -p .next/standalone/public .next/standalone/.next/static
          cp -r public/. .next/standalone/public/
          cp -r .next/static/. .next/standalone/.next/static/
      - run: npm run test:security:http
      # Audit dependencies shipped with the production server.
      - run: npm audit --omit=dev --audit-level=low
