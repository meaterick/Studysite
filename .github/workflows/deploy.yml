name: Deploy to OCI

# The OCI box only has 1GB RAM, so `npm ci` / `next build` never run there —
# a GitHub-hosted runner does the build and ships the "standalone" output
# (next.config.ts: output: "standalone") through the Actions cache. The self-hosted
# runner registered on the OCI box unpacks it into DEPLOY_DIR (a stable
# directory *outside* the runner's own workspace -- see the "Sync app
# files" step for why that matters), writes the runtime secret from a
# GitHub Actions secret, runs the app under PM2 with a blue-green switch
# (scripts/deploy/deploy.sh -- no downtime per deploy), and makes sure nginx +
# a Let's Encrypt certificate are set up for DOMAIN. nginx (not a custom
# proxy) terminates TLS and reverse-proxies to the app -- it's a proper
# systemd service from the moment it's installed, has near-zero RAM
# overhead, and certbot's official nginx plugin handles obtaining and
# renewing the certificate end to end. There is nothing to set up by hand
# on the server — the one-time setup is a GitHub secret (see docs/operations/deployment.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOMAIN: meaterickedu.kro.kr
  # Everything the running app touches lives here, NOT inside the runner's
  # own _work checkout. The self-hosted runner kills any process whose
  # executable path is still inside its job workspace once the job ends
  # ("Cleaning up orphan processes" in the run log) -- running from a
  # directory the runner doesn't own sidesteps that entirely. (nginx
  # itself isn't affected either way -- it's a systemd service, never part
  # of the runner's process tree.)
  DEPLOY_DIR: /home/ubuntu/aegis-ai-study

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # 서버(Node 26)와 크게 벌어지지 않도록 현재 LTS로 빌드한다.
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content (quiz/answers 정합성, LaTeX, 이미지)
        run: npm run validate:content

      - name: Verify curriculum documentation and local links
        run: npm run docs:check

      - name: Security regression checks
        run: npm run test:security

      - name: Build
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          mkdir -p .next/standalone/public
          [ -d public ] && cp -r public/. .next/standalone/public/ || true
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/

      - name: Save standalone bundle to the Actions cache
        # build → deploy 잡 사이에 번들을 넘길 때 artifact 대신 캐시를 쓴다.
        # private 저장소 무료 플랜에서 artifact는 Packages와 합쳐 0.5GB 한도에
        # 걸리지만(한도에 닿으면 업로드 자체가 막힌다), 캐시는 저장소당 10GB가
        # 따로 무료다. deploy 잡 마지막 단계에서 이 캐시를 바로 지운다.
        # (tar로 묶기 때문에 artifact와 달리 .next 같은 숨김 폴더도 그대로 담긴다.)
        uses: actions/cache/save@v5
        with:
          path: .next/standalone
          key: standalone-build-${{ github.run_id }}

  deploy:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
      # 마지막 단계에서 이번 실행의 빌드 캐시를 삭제하기 위해 필요하다.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain versions
        run: |
          node -v
          pm2 -v

      - name: Make sure the PM2 daemon runs under systemd
        # Self-hosted runners kill every process still in the job's process tree once the job
        # ends ("Cleaning up orphan processes"). If the PM2 daemon is a systemd service, every
        # `pm2 ...` command below just talks to it and the app is never part of this job's tree.
        # Previously every deploy did `pm2 kill` + `systemctl restart`, which took the site down
        # each time; now that only happens once, the first time the service is set up.
        run: |
          SERVICE="pm2-$(whoami)"
          if systemctl is-active --quiet "$SERVICE"; then
            echo "PM2 already runs under systemd (${SERVICE}.service)"
            exit 0
          fi
          # A daemon started outside systemd (e.g. by hand) is still serving the site: keep its
          # process list so systemd can resurrect it. Never call `pm2 save` without a running
          # daemon -- that would spawn an empty one and overwrite the saved list.
          if pgrep -u "$(whoami)" -f "PM2 .*God Daemon" >/dev/null; then pm2 save; fi
          STARTUP_LINE=$(pm2 startup systemd -u "$(whoami)" --hp "$HOME" 2>&1 | grep -E '^(sudo )?env PATH=' || true)
          if [ -n "$STARTUP_LINE" ]; then eval "$STARTUP_LINE" || true; fi
          if ! systemctl list-unit-files "${SERVICE}.service" 2>/dev/null | grep -q "${SERVICE}.service"; then
            echo "::error::Could not register PM2 as a systemd service (${SERVICE}.service). This needs passwordless sudo for the runner user."
            exit 1
          fi
          pm2 kill || true
          sudo systemctl start "$SERVICE"
          sleep 3
          pm2 list

      - name: Sync app files into a stable directory outside the runner workspace
        run: |
          mkdir -p "$DEPLOY_DIR/data" "$DEPLOY_DIR/logs" "$DEPLOY_DIR/releases"
          cp ecosystem.config.js "$DEPLOY_DIR/ecosystem.config.js"

      - name: Prepare to restore the bundle
        # 캐시는 build 잡(GitHub 호스팅 러너)에서 zstd로 압축된다. 이 서버에
        # zstd가 없으면 다른 압축 방식의 캐시를 찾게 되어 복원에 실패한다.
        # 이전 배포가 워크스페이스에 남긴 번들이 새 번들과 섞이지 않도록 먼저 지운다.
        run: |
          command -v zstd >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y zstd)
          rm -rf .next/standalone

      - name: Restore standalone bundle from the Actions cache
        # path는 build 잡의 저장 단계와 글자 하나까지 같아야 같은 캐시로 인식된다.
        uses: actions/cache/restore@v5
        with:
          path: .next/standalone
          key: standalone-build-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Write runtime secrets
        # Regenerated on every deploy from the GitHub Actions secrets, so
        # nothing has to be created or edited by hand on the server. Set/
        # rotate them at: repo Settings → Secrets and variables →
        # Actions → SESSION_SECRET / ADMIN_EMAILS.
        # (Passed via env:, not interpolated into the script, so the secret
        # can never break out of the shell command.) Lives in DEPLOY_DIR,
        # not the checkout, so it survives every checkout untouched.
        # PUBLIC_ORIGIN pins the site's own origin for redirects, so a client-sent
        # Host/X-Forwarded-Host header can never change where users are redirected.
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ "${#SESSION_SECRET}" -lt 32 ] || [[ "$SESSION_SECRET" == aegis-dev-* || "$SESSION_SECRET" == change-me* ]]; then
            echo "::error::SESSION_SECRET must be random and at least 32 characters. Set the repository Actions secret."
            exit 1
          fi
          umask 077
          {
            echo "SESSION_SECRET=${SESSION_SECRET}"
            echo "ADMIN_EMAILS=${ADMIN_EMAILS}"
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
            echo "DATA_DIR=${DEPLOY_DIR}/data"
            echo "PUBLIC_ORIGIN=https://${DOMAIN}"
            echo "TRUST_PROXY=1"
            echo "SECURITY_NGINX_LOG=/var/log/aegis-security/events.log"
            echo "SECURITY_HOST_TELEMETRY=/var/lib/aegis-security/telemetry.json"
          } > "$DEPLOY_DIR/.env.production.local"
          chmod 600 "$DEPLOY_DIR/.env.production.local"


      - name: Install nginx (first deploy only)
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y nginx
          fi

      - name: Deploy without downtime (blue-green)
        # Starts the new build on the idle port (3000 <-> 3001), waits for /api/health,
        # switches nginx over with a graceful reload, then stops the old build. If the new
        # build never becomes healthy (or the nginx config fails `nginx -t`), the old build
        # keeps serving and this step fails. See scripts/deploy/deploy.sh and nginx-site.sh
        # (the nginx config also carries per-IP rate/connection limits and HSTS).
        run: bash scripts/deploy/deploy.sh "$GITHUB_WORKSPACE/.next/standalone"

      - name: Obtain the HTTPS certificate (first deploy only)
        # Once a certificate exists, nginx-site.sh writes the HTTPS server block itself on every
        # deploy, so HTTPS no longer drops out while certbot re-adds it. certbot's own systemd
        # timer keeps renewing the certificate. (/etc/letsencrypt/live is root-only, hence `sudo test`.)
        run: |
          if sudo test -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem"; then
            echo "certificate for ${DOMAIN} already present"
            exit 0
          fi
          if ! command -v certbot >/dev/null 2>&1 || ! dpkg -s python3-certbot-nginx >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y certbot python3-certbot-nginx || \
              echo "::warning::Could not install certbot/python3-certbot-nginx automatically — install them once manually and re-run this workflow."
          fi
          if command -v certbot >/dev/null 2>&1; then
            sudo certbot --nginx \
              -d "${DOMAIN}" \
              --non-interactive --agree-tos --register-unsafely-without-email \
              --redirect --keep-until-expiring \
              || echo "::warning::certbot did not succeed — check that ${DOMAIN} really points at this server's public IP and that :80 is reachable from the internet."
          fi
          # Replace certbot's edits with our managed HTTPS config (limits, HSTS) right away.
          if sudo test -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem"; then
            bash scripts/deploy/nginx-site.sh "$(cat "$DEPLOY_DIR/active-port")"
          fi

      - name: Rotate app and PM2 logs
        # Hourly logrotate (systemd timer): cut logs past 20MB or a day old, keep 14.
        run: bash scripts/deploy/logrotate.sh

      - name: Install read-only SSH and firewall collector
        continue-on-error: true
        run: bash scripts/deploy/security-collector-install.sh

      - name: Record read-only host security inventory
        continue-on-error: true
        run: python3 scripts/deploy/security-inventory.py "$DEPLOY_DIR/data"

      - name: Verify the site actually responds
        # Runs from the OCI box itself, so it isn't affected by whatever
        # network path a browser or CI runner elsewhere on the internet
        # takes to get here. Never fails the job (informational). The
        # loopback checks send a Host header matching DOMAIN -- the nginx
        # config only serves that host.
        run: |
          sleep 2
          curl -m 5 -s -H "Host: ${DOMAIN}" -o /dev/null -w "http://127.0.0.1/ -> %{http_code} (expect 301)\n" http://127.0.0.1/ || echo "http://127.0.0.1/ -> (connection failed)"
          curl -m 5 -sk --resolve "${DOMAIN}:443:127.0.0.1" -o /dev/null -w "https://${DOMAIN}/ (loopback) -> %{http_code}\n" "https://${DOMAIN}/" || echo "https (loopback) -> (connection failed)"
          curl -m 5 -s -o /dev/null -w "https://${DOMAIN}/ -> %{http_code}\n" "https://${DOMAIN}/" || echo "https://${DOMAIN}/ -> (connection failed -- check DNS / OCI Security List for 80+443, 'sudo certbot certificates', and 'pm2 logs')"

      - name: Delete the build cache entry
        # 번들(약 34MB)은 위에서 DEPLOY_DIR/releases로 복사한 뒤에는 쓸 일이 없으니 바로
        # 지운다. 앞 단계가 실패하면 이 단계는 건너뛰므로, "Re-run failed jobs"로
        # deploy 잡만 다시 돌려도 캐시가 남아 있다(안 쓰는 캐시는 7일 뒤 자동 삭제).
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const key = `standalone-build-${context.runId}`;
            await github.rest.actions.deleteActionsCacheByKey({ owner, repo, key });
            core.info(`Deleted cache ${key}`);
