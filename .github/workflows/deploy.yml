name: Deploy to OCI

# The OCI box only has 1GB RAM, so `npm ci` / `next build` never run there —
# a GitHub-hosted runner does the build and ships the "standalone" output
# (next.config.ts: output: "standalone") as an artifact. The self-hosted
# runner registered on the OCI box only unpacks it, writes the runtime
# secret from a GitHub Actions secret, and asks PM2 to run `node server.js`.
# There is nothing to set up by hand on the server itself — the one-time
# setup is a GitHub secret (see README).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          mkdir -p .next/standalone/public
          [ -d public ] && cp -r public/. .next/standalone/public/ || true
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/

      - name: Upload standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone
          retention-days: 3

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout (keep ecosystem.config.js etc. in sync)
        uses: actions/checkout@v4
        with:
          # Do NOT clean: .env.production.local lives untracked in this same
          # checkout directory and must survive across runs.
          clean: false

      - name: Show toolchain versions
        run: |
          node -v
          pm2 -v

      - name: Download standalone bundle
        uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone

      - name: Write runtime secrets
        # Regenerated on every deploy from the GitHub Actions secret, so
        # nothing has to be created or edited by hand on the server. Set/
        # rotate the passcode at: repo Settings → Secrets and variables →
        # Actions → OPERATOR_PASSCODE.
        # (Passed via env:, not interpolated into the script, so the secret
        # can never break out of the shell command.)
        env:
          OPERATOR_PASSCODE: ${{ secrets.OPERATOR_PASSCODE }}
        run: |
          echo "OPERATOR_PASSCODE=${OPERATOR_PASSCODE}" > .env.production.local
          if [ -z "${OPERATOR_PASSCODE}" ]; then
            echo "::warning::OPERATOR_PASSCODE secret is not set — falling back to the built-in dev passcode. Add it under repo Settings > Secrets and variables > Actions."
          fi

      - name: Start or reload with PM2
        run: |
          pm2 startOrReload ecosystem.config.js
          pm2 save

      - name: Keep PM2 running across server reboots
        # Best-effort and non-interactive: only succeeds if the runner
        # already has passwordless root/sudo. Never blocks the deploy.
        run: |
          STARTUP_LINE=$(pm2 startup systemd -u "$(whoami)" --hp "$HOME" 2>&1 | grep -E '^(sudo )?env PATH=' || true)
          if [ -n "$STARTUP_LINE" ]; then
            eval "$STARTUP_LINE" || echo "::warning::Could not register PM2 as a boot service automatically (needs passwordless sudo). The app still redeploys fine on the next push either way."
          fi
          pm2 save
