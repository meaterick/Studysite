name: Deploy to OCI

# The OCI box only has 1GB RAM, so `npm ci` / `next build` never run there —
# a GitHub-hosted runner does the build and ships the "standalone" output
# (next.config.ts: output: "standalone") as an artifact. The self-hosted
# runner registered on the OCI box unpacks it into DEPLOY_DIR (a stable
# directory *outside* the runner's own workspace -- see the "Sync app
# files" step for why that matters), writes the runtime secret from a
# GitHub Actions secret, makes sure a Let's Encrypt cert exists for DOMAIN
# (via certbot), and asks PM2 to run the app + the dependency-free TLS
# proxy in proxy/tls-proxy.js (no nginx). There is nothing to set up by
# hand on the server — the one-time setup is a GitHub secret (see README).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOMAIN: meaterickedu.kro.kr
  # Everything the running app/proxy touches lives here, NOT inside the
  # runner's own _work checkout. The self-hosted runner kills any process
  # whose executable path is still inside its job workspace once the job
  # ends ("Cleaning up orphan processes" in the run log) -- it did this to
  # aegis-tls-proxy on every deploy, even after handing PM2 off to
  # systemd, because the running proxy/app files were served straight out
  # of the checkout. Running them from a directory the runner doesn't own
  # sidesteps that entirely.
  DEPLOY_DIR: /home/ubuntu/aegis-ai-study

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          mkdir -p .next/standalone/public
          [ -d public ] && cp -r public/. .next/standalone/public/ || true
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/

      - name: Upload standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone
          retention-days: 3

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          node -v
          pm2 -v

      - name: Sync app files into a stable directory outside the runner workspace
        # ecosystem.config.js and proxy/ are the only source files the
        # running processes need -- copy the current versions in, so this
        # stays in sync with the repo on every deploy without ever running
        # anything from inside $GITHUB_WORKSPACE.
        run: |
          mkdir -p "$DEPLOY_DIR"
          cp ecosystem.config.js "$DEPLOY_DIR/ecosystem.config.js"
          rm -rf "$DEPLOY_DIR/proxy"
          cp -r proxy "$DEPLOY_DIR/proxy"

      - name: Clear previous build
        run: rm -rf "$DEPLOY_DIR/.next"

      - name: Download standalone bundle
        uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: ${{ env.DEPLOY_DIR }}/.next/standalone

      - name: Write runtime secrets
        # Regenerated on every deploy from the GitHub Actions secret, so
        # nothing has to be created or edited by hand on the server. Set/
        # rotate the passcode at: repo Settings → Secrets and variables →
        # Actions → OPERATOR_PASSCODE.
        # (Passed via env:, not interpolated into the script, so the secret
        # can never break out of the shell command.) Lives in DEPLOY_DIR,
        # not the checkout, so it survives every checkout untouched.
        env:
          OPERATOR_PASSCODE: ${{ secrets.OPERATOR_PASSCODE }}
        run: |
          {
            echo "OPERATOR_PASSCODE=${OPERATOR_PASSCODE}"
            echo "DOMAIN=${DOMAIN}"
          } > "$DEPLOY_DIR/.env.production.local"
          if [ -z "${OPERATOR_PASSCODE}" ]; then
            echo "::warning::OPERATOR_PASSCODE secret is not set — falling back to the built-in dev passcode. Add it under repo Settings > Secrets and variables > Actions."
          fi

      - name: Stop any pre-existing nginx
        # This box had nginx installed before the switch to
        # proxy/tls-proxy.js. If it's still running it squats on :80 and
        # aegis-tls-proxy fails to bind — best-effort, idempotent, never
        # blocks the deploy (no-ops cleanly if nginx isn't installed).
        run: |
          if systemctl is-active --quiet nginx 2>/dev/null; then
            sudo systemctl stop nginx || echo "::warning::Could not stop nginx — it may still be holding :80, which will block aegis-tls-proxy from binding it."
          fi
          sudo systemctl disable nginx >/dev/null 2>&1 || true

      - name: Allow Node.js to bind :80/:443 as a non-root user
        # aegis-tls-proxy runs as "ubuntu" (via PM2/systemd), not root, and
        # Linux blocks binding ports <1024 without CAP_NET_BIND_SERVICE.
        # proxy/tls-proxy.js only logs a bind error and keeps running
        # (autorestart would just loop forever otherwise), so a missing
        # capability here looks like "PM2 says online" while curl to :80
        # gets connection refused. Grant the capability to the actual node
        # binary; idempotent and safe to redo every deploy.
        run: |
          if ! command -v setcap >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y libcap2-bin || \
              echo "::warning::Could not install libcap2-bin (for setcap) automatically."
          fi
          NODE_BIN="$(readlink -f "$(command -v node)")"
          if command -v setcap >/dev/null 2>&1 && sudo setcap 'cap_net_bind_service=+ep' "$NODE_BIN"; then
            getcap "$NODE_BIN"
          else
            echo "::error::Could not grant cap_net_bind_service to $NODE_BIN -- aegis-tls-proxy cannot bind :80/:443 as a non-root user without it."
          fi

      - name: Start or reload with PM2
        # aegis-tls-proxy comes up here too — its :80 listener is what
        # certbot's webroot challenge below needs already running. If no
        # certificate exists yet, the proxy simply skips :443 for now.
        run: |
          pm2 startOrReload "$DEPLOY_DIR/ecosystem.config.js"
          pm2 save

      - name: Obtain/renew the HTTPS certificate (certbot, no nginx)
        # Idempotent: certbot no-ops if the existing cert still has >30 days
        # left, so this is safe and cheap to run on every deploy. Uses the
        # webroot plugin — it only writes challenge files, it never binds a
        # port itself, so there's no conflict with aegis-tls-proxy already
        # owning :80/:443.
        run: |
          if ! command -v certbot >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y certbot || \
              echo "::warning::Could not install certbot automatically — HTTPS cert cannot be obtained. Install certbot once manually (apt-get install certbot) and re-run this workflow."
          fi
          if command -v certbot >/dev/null 2>&1; then
            sudo certbot certonly --webroot \
              -w "$DEPLOY_DIR/certs/webroot" \
              -d "${DOMAIN}" \
              --non-interactive --agree-tos --register-unsafely-without-email \
              --keep-until-expiring \
              || echo "::warning::certbot did not succeed — check that ${DOMAIN} really points at this server's public IP and that :80 is reachable from the internet."

            # So renewals (certbot's own systemd timer/cron, installed by
            # the package) reload the new cert without any manual step.
            sudo mkdir -p /etc/letsencrypt/renewal-hooks/deploy
            printf '#!/bin/sh\npm2 restart aegis-tls-proxy\n' | sudo tee /etc/letsencrypt/renewal-hooks/deploy/aegis-tls-proxy.sh >/dev/null
            sudo chmod +x /etc/letsencrypt/renewal-hooks/deploy/aegis-tls-proxy.sh
          fi

          # Pick up a certificate that may have just been issued for the
          # first time (a no-op restart if it was already loaded).
          pm2 restart aegis-tls-proxy || true
          pm2 save

      - name: Hand PM2 off to systemd (survive this job ending)
        # Self-hosted runners kill every process still in the job's
        # process tree once the job completes ("Cleaning up orphan
        # processes" in the run log) -- including a PM2 daemon started
        # with `detached: true`. Register PM2 as a systemd service
        # (idempotent), then stop the daemon that's still attached to this
        # job and let systemd spawn a fresh one from the saved process
        # list. Combined with running everything out of DEPLOY_DIR above
        # (not $GITHUB_WORKSPACE), this survives both this job ending and
        # server reboots.
        run: |
          pm2 save

          SERVICE="pm2-$(whoami)"
          STARTUP_LINE=$(pm2 startup systemd -u "$(whoami)" --hp "$HOME" 2>&1 | grep -E '^(sudo )?env PATH=' || true)
          if [ -n "$STARTUP_LINE" ]; then
            eval "$STARTUP_LINE" || true
          fi

          if systemctl list-unit-files "${SERVICE}.service" 2>/dev/null | grep -q "${SERVICE}.service"; then
            pm2 kill
            if sudo systemctl restart "$SERVICE"; then
              sleep 3
              pm2 list
              echo "PM2 now runs under systemd (${SERVICE}.service) -- it will survive this job ending and server reboots."
            else
              echo "::error::'sudo systemctl restart ${SERVICE}' failed after 'pm2 kill' -- the site is down right now. Run that command by hand on the server to bring it back."
            fi
          else
            echo "::error::Could not register PM2 as a systemd service (${SERVICE}.service not found) -- the site will go down as soon as this job ends, because the runner kills any process left in its job tree. This needs passwordless sudo for the runner user; check the 'pm2 startup systemd' output above this step."
          fi

      - name: Verify the site actually responds
        # Runs from the OCI box itself, so it isn't affected by whatever
        # network path a browser or CI runner elsewhere on the internet
        # takes to get here. Never fails the job (informational) -- read
        # the printed status codes to tell apart "proxy isn't listening",
        # "OCI's firewall/Security List blocks inbound", and "DNS points
        # somewhere else".
        run: |
          sleep 2
          echo "Loopback (proxy listening on this box at all?):"
          curl -m 5 -s -o /dev/null -w '  http://127.0.0.1/ -> %{http_code}\n' http://127.0.0.1/ || echo "  http://127.0.0.1/ -> (connection failed)"
          echo "Public domain, from this box (DNS + routing + OCI firewall, minus the client's own network path):"
          curl -m 5 -s -o /dev/null -w "  http://${DOMAIN}/ -> %{http_code}\n" "http://${DOMAIN}/" || echo "  http://${DOMAIN}/ -> (connection failed)"
          echo "This box's own public IP (compare against the DNS record for ${DOMAIN}):"
          curl -m 5 -s https://ifconfig.me || echo "(could not determine)"
          echo
