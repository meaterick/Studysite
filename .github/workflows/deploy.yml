name: Deploy to OCI

# The OCI box only has 1GB RAM, so `npm ci` / `next build` never run there —
# a GitHub-hosted runner does the build and ships the "standalone" output
# (next.config.ts: output: "standalone") as an artifact. The self-hosted
# runner registered on the OCI box unpacks it into DEPLOY_DIR (a stable
# directory *outside* the runner's own workspace -- see the "Sync app
# files" step for why that matters), writes the runtime secret from a
# GitHub Actions secret, runs the app under PM2, and makes sure nginx +
# a Let's Encrypt certificate are set up for DOMAIN. nginx (not a custom
# proxy) terminates TLS and reverse-proxies to the app -- it's a proper
# systemd service from the moment it's installed, has near-zero RAM
# overhead, and certbot's official nginx plugin handles obtaining and
# renewing the certificate end to end. There is nothing to set up by hand
# on the server — the one-time setup is a GitHub secret (see README).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOMAIN: meaterickedu.kro.kr
  # Everything the running app touches lives here, NOT inside the runner's
  # own _work checkout. The self-hosted runner kills any process whose
  # executable path is still inside its job workspace once the job ends
  # ("Cleaning up orphan processes" in the run log) -- running from a
  # directory the runner doesn't own sidesteps that entirely. (nginx
  # itself isn't affected either way -- it's a systemd service, never part
  # of the runner's process tree.)
  DEPLOY_DIR: /home/ubuntu/aegis-ai-study

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          mkdir -p .next/standalone/public
          [ -d public ] && cp -r public/. .next/standalone/public/ || true
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/

      - name: Upload standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone
          retention-days: 3
          # upload-artifact v4 drops dotfiles/dot-directories by default --
          # silently excluding .next/standalone/.next itself (the compiled
          # server output + the static assets just copied in above).
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          node -v
          pm2 -v

      - name: Sync app files into a stable directory outside the runner workspace
        run: |
          mkdir -p "$DEPLOY_DIR"
          cp ecosystem.config.js "$DEPLOY_DIR/ecosystem.config.js"

      - name: Clear previous build
        run: rm -rf "$DEPLOY_DIR/.next"

      - name: Download standalone bundle
        uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: ${{ env.DEPLOY_DIR }}/.next/standalone

      - name: Write runtime secrets
        # Regenerated on every deploy from the GitHub Actions secret, so
        # nothing has to be created or edited by hand on the server. Set/
        # rotate the passcode at: repo Settings → Secrets and variables →
        # Actions → OPERATOR_PASSCODE.
        # (Passed via env:, not interpolated into the script, so the secret
        # can never break out of the shell command.) Lives in DEPLOY_DIR,
        # not the checkout, so it survives every checkout untouched.
        env:
          OPERATOR_PASSCODE: ${{ secrets.OPERATOR_PASSCODE }}
        run: |
          echo "OPERATOR_PASSCODE=${OPERATOR_PASSCODE}" > "$DEPLOY_DIR/.env.production.local"
          if [ -z "${OPERATOR_PASSCODE}" ]; then
            echo "::warning::OPERATOR_PASSCODE secret is not set — falling back to the built-in dev passcode. Add it under repo Settings > Secrets and variables > Actions."
          fi

      - name: Remove the old custom TLS proxy, if still registered
        # One-time (but idempotent) cleanup for boxes that deployed the
        # earlier nginx-free design: that PM2 app (aegis-tls-proxy) isn't
        # declared in the current ecosystem.config.js, so plain `pm2
        # delete` of that file can't touch it -- and if it's still alive
        # it's squatting on :80/:443, which would stop nginx from binding
        # them. No-ops cleanly once it's gone.
        run: pm2 delete aegis-tls-proxy 2>/dev/null || true

      - name: Install and configure nginx
        # Idempotent: safe to run on every deploy. Installs nginx if it
        # isn't there yet, writes a plain-HTTP reverse-proxy site pointing
        # at the app, and disables the stock default site so it can't
        # collide with ours.
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y nginx
          fi

          cat <<NGINX_CONF | sudo tee /etc/nginx/sites-available/aegis-ai-study.conf >/dev/null
          server {
              listen 80;
              listen [::]:80;
              server_name ${DOMAIN};

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX_CONF

          sudo ln -sf /etc/nginx/sites-available/aegis-ai-study.conf /etc/nginx/sites-enabled/aegis-ai-study.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl enable --now nginx
          sudo systemctl reload nginx

      - name: Start or reload the app with PM2
        # Delete + start, not startOrReload: PM2's "reload" of an
        # already-registered app reuses its originally-stored cwd/script/
        # env and does not re-read those from the config file. Deleting
        # first guarantees every deploy fully re-registers the app from
        # the current file.
        run: |
          pm2 delete "$DEPLOY_DIR/ecosystem.config.js" 2>/dev/null || true
          pm2 start "$DEPLOY_DIR/ecosystem.config.js"
          pm2 save

      - name: Obtain/renew the HTTPS certificate (certbot's nginx plugin)
        # Idempotent: certbot no-ops if the existing cert still has >30 days
        # left. The nginx plugin edits the site config in place to add the
        # ssl_certificate directives and the http->https redirect, and
        # reloads nginx itself -- nothing else to wire up. Renewal is
        # handled by the certbot package's own systemd timer.
        run: |
          if ! command -v certbot >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y certbot python3-certbot-nginx || \
              echo "::warning::Could not install certbot automatically — HTTPS cert cannot be obtained. Install certbot + python3-certbot-nginx once manually and re-run this workflow."
          fi
          if command -v certbot >/dev/null 2>&1; then
            sudo certbot --nginx \
              -d "${DOMAIN}" \
              --non-interactive --agree-tos --register-unsafely-without-email \
              --redirect --keep-until-expiring \
              || echo "::warning::certbot did not succeed — check that ${DOMAIN} really points at this server's public IP and that :80 is reachable from the internet."
          fi

      - name: Keep PM2 running across this job ending and server reboots
        # Self-hosted runners kill every process still in the job's
        # process tree once the job completes ("Cleaning up orphan
        # processes" in the run log) -- including a PM2 daemon started
        # with `detached: true`. Register PM2 as a systemd service
        # (idempotent), then stop the daemon that's still attached to this
        # job and let systemd spawn a fresh one from the saved process
        # list. Combined with running everything out of DEPLOY_DIR above
        # (not $GITHUB_WORKSPACE), this survives both this job ending and
        # server reboots. (nginx needs none of this -- it's already a
        # systemd service.)
        run: |
          pm2 save

          SERVICE="pm2-$(whoami)"
          STARTUP_LINE=$(pm2 startup systemd -u "$(whoami)" --hp "$HOME" 2>&1 | grep -E '^(sudo )?env PATH=' || true)
          if [ -n "$STARTUP_LINE" ]; then
            eval "$STARTUP_LINE" || true
          fi

          if systemctl list-unit-files "${SERVICE}.service" 2>/dev/null | grep -q "${SERVICE}.service"; then
            pm2 kill
            if sudo systemctl restart "$SERVICE"; then
              sleep 3
              pm2 list
              echo "PM2 now runs under systemd (${SERVICE}.service) -- it will survive this job ending and server reboots."
            else
              echo "::error::'sudo systemctl restart ${SERVICE}' failed after 'pm2 kill' -- the site is down right now. Run that command by hand on the server to bring it back."
            fi
          else
            echo "::error::Could not register PM2 as a systemd service (${SERVICE}.service not found) -- the site will go down as soon as this job ends, because the runner kills any process left in its job tree. This needs passwordless sudo for the runner user; check the 'pm2 startup systemd' output above this step."
          fi

      - name: Verify the site actually responds
        # Runs from the OCI box itself, so it isn't affected by whatever
        # network path a browser or CI runner elsewhere on the internet
        # takes to get here. Never fails the job (informational).
        run: |
          sleep 2
          curl -m 5 -s -o /dev/null -w "http://127.0.0.1/ -> %{http_code}\n" http://127.0.0.1/ || echo "http://127.0.0.1/ -> (connection failed)"
          curl -m 5 -sk -o /dev/null -w "https://127.0.0.1/ -> %{http_code}\n" https://127.0.0.1/ || echo "https://127.0.0.1/ -> (connection failed)"
          curl -m 5 -s -o /dev/null -w "https://${DOMAIN}/ -> %{http_code}\n" "https://${DOMAIN}/" || echo "https://${DOMAIN}/ -> (connection failed -- check DNS / OCI Security List for 80+443, 'sudo certbot certificates', and 'pm2 logs aegis-ai-study')"
